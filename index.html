<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Dictation Calculator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&family=Red+Hat+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* Layout: one centered column. Display card on top, a wide mic bar, an optional keypad, recent results last. */
  :root {
    --bg: #edf0f4;
    --surface: #ffffff;
    --surface-2: #e3e8ef;
    --ink: #15202b;
    --muted: #5d6b7b;
    --line: #d5dce5;
    --accent: #3a47d5;
    --accent-ink: #ffffff;
    --accent-soft: #e4e7fb;
    --warn: #a8570c;
    --font-ui: 'Figtree', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --font-num: 'Red Hat Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1319;
      --surface: #171e27;
      --surface-2: #222b37;
      --ink: #e7edf4;
      --muted: #93a1b2;
      --line: #2a3441;
      --accent: #8d98ff;
      --accent-ink: #0e1319;
      --accent-soft: #232a52;
      --warn: #e6a15c;
    }
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 400 16px/1.45 var(--font-ui);
    min-height: 100dvh;
    -webkit-text-size-adjust: 100%;
    touch-action: manipulation;
  }
  button { font: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  .app {
    max-width: 460px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 14px;
    padding-block: max(16px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-bottom));
    padding-left: max(16px, env(safe-area-inset-left));
    padding-right: max(16px, env(safe-area-inset-right));
  }

  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  h1 { margin: 0; font-size: 18px; font-weight: 700; letter-spacing: 0.01em; }
  .toggle {
    border: 1px solid var(--line);
    background: var(--surface);
    border-radius: 999px;
    padding: 7px 14px;
    font-weight: 600;
    font-size: 14px;
  }
  .toggle[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }

  .display {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 22px;
    padding: 16px 18px 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .display-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .heard {
    margin: 0;
    font-size: 14px;
    font-style: italic;
    color: var(--muted);
    min-height: 1.45em;
    overflow-wrap: anywhere;
    min-width: 0;
  }
  .heard.interim { opacity: 0.65; }
  .clear {
    flex: none;
    border: 0;
    background: transparent;
    color: var(--accent);
    font-weight: 600;
    font-size: 14px;
    padding: 2px 4px;
    border-radius: 8px;
  }

  .chips {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px;
    min-height: 44px;
  }
  .chips:empty::before { content: 'Say a calculation'; color: var(--muted); font-size: 18px; }
  .chip {
    font: 500 21px/1.2 var(--font-num);
    padding: 5px 10px;
    border-radius: 10px;
    background: var(--surface-2);
    border: 2px solid transparent;
  }
  .chip.op { background: transparent; color: var(--accent); padding-inline: 6px; }
  .chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
  .chip.typing { border-bottom-color: var(--accent); }

  .result {
    margin: 0;
    text-align: right;
    font: 500 3.3rem/1.1 var(--font-num);
    font-variant-numeric: tabular-nums;
    overflow-wrap: anywhere;
  }
  .result.dim { color: var(--muted); opacity: 0.55; }
  .note { margin: 0; min-height: 1.3em; text-align: right; font-size: 13px; color: var(--warn); }

  .mic {
    display: flex;
    align-items: center;
    gap: 14px;
    width: 100%;
    min-height: 64px;
    padding: 12px 18px;
    text-align: left;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 20px;
    font-weight: 600;
  }
  .mic .dot {
    flex: none;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: var(--muted);
  }
  .mic[data-state="listening"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .mic[data-state="listening"] .dot { background: var(--accent); animation: pulse 1.6s ease-out infinite; }
  .mic[data-state="starting"] .dot { background: var(--accent); }
  .mic[data-state="blocked"], .mic[data-state="nomic"], .mic[data-state="network"], .mic[data-state="unsupported"] { color: var(--warn); }
  .mic[data-state="unsupported"] { cursor: default; }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 55%, transparent); }
    100% { box-shadow: 0 0 0 14px transparent; }
  }
  @media (prefers-reduced-motion: reduce) { .mic[data-state="listening"] .dot { animation: none; } }

  .hint { margin: -4px 4px 0; font-size: 13px; color: var(--muted); }

  .keypad { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .key {
    height: 58px;
    border-radius: 14px;
    border: 1px solid var(--line);
    background: var(--surface);
    font: 500 23px var(--font-num);
    user-select: none;
    -webkit-user-select: none;
  }
  .key:active { transform: scale(0.97); }
  .key.op { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
  .key.eq { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

  .recent h2 {
    margin: 4px 4px 8px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .recent ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  .recent button {
    width: 100%;
    display: flex;
    justify-content: space-between;
    gap: 12px;
    align-items: baseline;
    text-align: left;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 9px 12px;
  }
  .recent .expr { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); font: 400 14px var(--font-num); }
  .recent .res { flex: none; font: 500 16px var(--font-num); font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<main class="app">
  <header class="top">
    <h1>Dictation Calculator</h1>
    <button id="kpToggle" class="toggle" type="button" aria-pressed="false" aria-controls="keypad">Keypad</button>
  </header>

  <section class="display" aria-label="Calculation">
    <div class="display-top">
      <p id="heard" class="heard"></p>
      <button id="clear" class="clear" type="button">Clear</button>
    </div>
    <div id="chips" class="chips" aria-label="Expression"></div>
    <p id="result" class="result dim" aria-live="polite">0</p>
    <p id="note" class="note" aria-live="polite"></p>
  </section>

  <button id="mic" class="mic" type="button" data-state="idle" aria-pressed="false">
    <span class="dot" aria-hidden="true"></span>
    <span id="micLabel">Tap to start listening</span>
  </button>
  <p class="hint">Try “twelve times forty five plus nine”. Then “plus twenty” keeps going from the answer. “Scratch that” undoes, “clear” starts over.</p>

  <section id="keypad" class="keypad" aria-label="Keypad" hidden>
    <button class="key" type="button" data-k="(" aria-label="Open parenthesis">(</button>
    <button class="key" type="button" data-k=")" aria-label="Close parenthesis">)</button>
    <button class="key" type="button" data-k="%" aria-label="Percent">%</button>
    <button class="key op" type="button" data-k="/" aria-label="Divide">÷</button>
    <button class="key" type="button" data-k="7">7</button>
    <button class="key" type="button" data-k="8">8</button>
    <button class="key" type="button" data-k="9">9</button>
    <button class="key op" type="button" data-k="*" aria-label="Multiply">×</button>
    <button class="key" type="button" data-k="4">4</button>
    <button class="key" type="button" data-k="5">5</button>
    <button class="key" type="button" data-k="6">6</button>
    <button class="key op" type="button" data-k="-" aria-label="Subtract">−</button>
    <button class="key" type="button" data-k="1">1</button>
    <button class="key" type="button" data-k="2">2</button>
    <button class="key" type="button" data-k="3">3</button>
    <button class="key op" type="button" data-k="+" aria-label="Add">+</button>
    <button class="key" type="button" data-k="0">0</button>
    <button class="key" type="button" data-k="." aria-label="Decimal point">.</button>
    <button class="key" type="button" data-k="back" aria-label="Backspace">⌫</button>
    <button class="key eq" type="button" data-k="=" aria-label="Equals, keep result">=</button>
  </section>

  <section id="recent" class="recent" hidden>
    <h2>Recent</h2>
    <ul id="history"></ul>
  </section>
</main>

<script>
// ---- core:start (pure logic: spoken-math parser, evaluator, formatting; no DOM)
const UNITS = { zero:0, one:1, two:2, three:3, four:4, five:5, six:6, seven:7, eight:8, nine:9, ten:10, eleven:11, twelve:12, thirteen:13, fourteen:14, fifteen:15, sixteen:16, seventeen:17, eighteen:18, nineteen:19 };
const TENS = { twenty:20, thirty:30, forty:40, fourty:40, fifty:50, sixty:60, seventy:70, eighty:80, ninety:90 };
const SCALES = { thousand:1e3, million:1e6, billion:1e9, trillion:1e12 };
const DIGITW = { zero:'0', oh:'0', one:'1', two:'2', three:'3', four:'4', five:'5', six:'6', seven:'7', eight:'8', nine:'9' };
const FILLER = new Set(['a','an','um','uh','hmm','so','okay','ok','then','now','just','lets','let','me','give','find','get','and','to','for','in','it','that','this','you','can','could','would','hey']);
const OPS = ['+','-','*','/','^'];
const NUM_RE = /^(\d+\.?\d*|\.\d+)$/;

function has(o, k) { return Object.prototype.hasOwnProperty.call(o, k); }
function isNumTok(t) { return typeof t === 'string' && NUM_RE.test(t); }
function numToStr(v) {
  let s = String(v);
  if (/e/i.test(s)) s = v.toLocaleString('en-US', { useGrouping: false, maximumFractionDigits: 20 });
  return s;
}

function wordKind(w) {
  if (w === undefined) return null;
  if (w === 'zero') return 'zero';
  if (has(UNITS, w)) return UNITS[w] < 10 ? 'unit' : 'teen';
  if (has(TENS, w)) return 'tens';
  if (w === 'hundred') return 'hundred';
  if (has(SCALES, w)) return 'scale';
  return null;
}

function readDecimal(tk, j) {
  if (tk[j] !== 'point' && tk[j] !== 'dot') return { dec: '', next: j };
  let m = j + 1, dec = '';
  while (m < tk.length) {
    const d = tk[m];
    if (has(DIGITW, d)) { dec += DIGITW[d]; m++; }
    else if (/^\d+$/.test(d)) { dec += d; m++; }
    else break;
  }
  return dec ? { dec, next: m } : { dec: '', next: j };
}

function readNumberWords(tk, i) {
  let total = 0, cur = 0, last = null, any = false, j = i;
  for (; j < tk.length; j++) {
    const w = tk[j];
    const k = wordKind(w);
    if (k === 'zero') {
      if (last === null) { any = true; last = 'zero'; j++; }
      break;
    } else if (k === 'unit') {
      if (last === null || last === 'tens' || last === 'hundred' || last === 'scale') { cur += UNITS[w]; last = 'unit'; any = true; } else break;
    } else if (k === 'teen') {
      if (last === null || last === 'hundred' || last === 'scale') { cur += UNITS[w]; last = 'teen'; any = true; } else break;
    } else if (k === 'tens') {
      if (last === null || last === 'hundred' || last === 'scale') { cur += TENS[w]; last = 'tens'; any = true; } else break;
    } else if (k === 'hundred') {
      if (last === null || last === 'unit' || last === 'teen') { cur = (cur || 1) * 100; last = 'hundred'; any = true; } else break;
    } else if (k === 'scale') {
      total += (cur || 1) * SCALES[w]; cur = 0; last = 'scale'; any = true;
    } else if (w === 'a' && last === null) {
      const nx = tk[j + 1];
      if (nx === 'hundred' || has(SCALES, nx)) { cur = 1; last = 'unit'; any = true; } else break;
    } else if (w === 'and') {
      const nk = wordKind(tk[j + 1]);
      if (any && (last === 'hundred' || last === 'scale') && (nk === 'unit' || nk === 'teen' || nk === 'tens')) continue;
      break;
    } else break;
  }
  const { dec, next } = readDecimal(tk, j);
  if (dec) { j = next; any = true; }
  if (!any) return null;
  let value = parseFloat(String(total + cur) + (dec ? '.' + dec : ''));
  if (dec) {
    while (j < tk.length && has(SCALES, tk[j])) { value *= SCALES[tk[j]]; j++; }
  }
  return { value, next: j };
}

const PHRASES = [
  [/\b(?:per ?cent|percent|percentage) of\b/g, ' % * '],
  [/%\s*of\b/g, ' % * '],
  [/\b(?:per ?cent|percent|percentage)\b/g, ' % '],
  [/\b(?:multiplied by|multiply by|times by|times|multiplied)\b/g, ' * '],
  [/\b(?:divided by|divide by|divided|over)\b/g, ' / '],
  [/\b(?:to the power of|to the power|raised to the power of|raised to|power of)\b/g, ' ^ '],
  [/\bsquared\b/g, ' ^ 2 '],
  [/\bcubed\b/g, ' ^ 3 '],
  [/\b(?:plus|added to|add)\b/g, ' + '],
  [/\b(?:minus|take away|subtract|less)\b/g, ' - '],
  [/\bnegative\b/g, ' neg '],
  [/\b(?:open|left) (?:parenthesis|parentheses|paren|bracket)\b/g, ' ( '],
  [/\b(?:close|closed|right) (?:parenthesis|parentheses|paren|bracket)\b/g, ' ) '],
  [/\b(?:what is|what's|whats|what|calculate|compute|equals|equal|is|the|answer|please|how much|tell me|of|by)\b/g, ' '],
];

function parseSpoken(text) {
  let s = ' ' + String(text).toLowerCase() + ' ';
  while (/(\d),(\d{3})/.test(s)) s = s.replace(/(\d),(\d{3})/g, '$1$2');
  s = s.replace(/[?!,;:"“”]/g, ' ')
       .replace(/[$£€]/g, ' ')
       .replace(/÷/g, ' / ')
       .replace(/[×✕]/g, ' * ')
       .replace(/[−–—]/g, ' - ')
       .replace(/([a-z])-([a-z])/g, '$1 $2')
       .replace(/(\d)\s*x\s*(\d)/g, '$1 * $2')
       .replace(/\bx\b/g, ' * ');
  for (const [re, rep] of PHRASES) s = s.replace(re, rep);

  const tk = s.match(/\d+(?:\.\d*)?|\.\d+|[a-z]+|[+\-*\/^()%]/g) || [];
  const out = [], unknown = [];
  let firstFromNeg = false, i = 0;
  while (i < tk.length) {
    const t = tk[i];
    if (/^(\d|\.\d)/.test(t)) {
      let str = t.replace(/\.$/, '');
      i++;
      const d = readDecimal(tk, i);
      if (d.dec && !str.includes('.')) { str += '.' + d.dec; i = d.next; }
      let v = parseFloat(str);
      while (i < tk.length && (has(SCALES, tk[i]) || tk[i] === 'hundred')) { v *= tk[i] === 'hundred' ? 100 : SCALES[tk[i]]; i++; }
      out.push(numToStr(v));
    } else if (wordKind(t) !== null || t === 'point' || t === 'dot' || (t === 'a' && (tk[i + 1] === 'hundred' || has(SCALES, tk[i + 1])))) {
      const r = readNumberWords(tk, i);
      if (r) { out.push(numToStr(r.value)); i = r.next; } else { i++; }
    } else if ('+-*/^()%'.includes(t) && t.length === 1) {
      out.push(t); i++;
    } else if (t === 'neg') {
      if (out.length === 0) firstFromNeg = true;
      out.push('-'); i++;
    } else if (t === 'and') {
      out.push('+'); i++;
    } else {
      if (!FILLER.has(t) && !unknown.includes(t)) unknown.push(t);
      i++;
    }
  }
  const leadingOp = out.length > 0 && (['+', '*', '/', '^'].includes(out[0]) || (out[0] === '-' && !firstFromNeg));
  return { tokens: out, leadingOp, unknown, hasNumber: out.some(isNumTok) };
}

class CalcError extends Error {
  constructor(message, incomplete) { super(message); this.incomplete = !!incomplete; }
}

function evaluate(tokens) {
  let p = 0;
  const peek = () => tokens[p];
  function expr() {
    let r = term();
    while (peek() === '+' || peek() === '-') {
      const op = tokens[p++];
      const rhs = term();
      const rv = rhs.pct ? r.v * rhs.v : rhs.v;
      r = { v: op === '+' ? r.v + rv : r.v - rv, pct: false };
    }
    return r;
  }
  function term() {
    let r = unary();
    while (peek() === '*' || peek() === '/') {
      const op = tokens[p++];
      const rhs = unary();
      if (op === '*') r = { v: r.v * rhs.v, pct: false };
      else {
        if (rhs.v === 0) throw new CalcError("Can't divide by zero");
        r = { v: r.v / rhs.v, pct: false };
      }
    }
    return r;
  }
  function unary() {
    if (peek() === '-') { p++; const r = unary(); return { v: -r.v, pct: false }; }
    if (peek() === '+') { p++; return unary(); }
    return power();
  }
  function power() {
    const b = postfix();
    if (peek() === '^') { p++; const e = unary(); return { v: Math.pow(b.v, e.v), pct: false }; }
    return b;
  }
  function postfix() {
    let r = primary();
    while (peek() === '%') { p++; r = { v: r.v / 100, pct: true }; }
    return r;
  }
  function primary() {
    const t = tokens[p];
    if (t === undefined) throw new CalcError('Incomplete', true);
    if (isNumTok(t)) { p++; return { v: parseFloat(t), pct: false }; }
    if (t === '(') {
      p++;
      const r = expr();
      if (peek() !== ')') throw new CalcError('Missing )', peek() === undefined);
      p++;
      return { v: r.v, pct: false };
    }
    throw new CalcError('Check the expression');
  }
  const r = expr();
  if (p < tokens.length) throw new CalcError('Check the expression');
  return r.v;
}

function tryEval(tokens) {
  if (!tokens.length) return { ok: false, empty: true };
  const t = tokens.slice();
  let open = 0;
  for (const x of t) { if (x === '(') open++; else if (x === ')') open = Math.max(0, open - 1); }
  while (open-- > 0) t.push(')');
  try {
    const v = evaluate(t);
    if (!isFinite(v)) return { ok: false, message: 'Not a valid result' };
    return { ok: true, value: v };
  } catch (e) {
    if (e instanceof CalcError) return { ok: false, incomplete: e.incomplete, message: e.message };
    throw e;
  }
}

function fmt(v) {
  const n = parseFloat(v.toPrecision(12));
  if (n !== 0 && (Math.abs(n) >= 1e15 || Math.abs(n) < 1e-9)) return n.toExponential(6).replace(/\.?0+e/, 'e');
  return n.toLocaleString('en-US', { maximumFractionDigits: 10 });
}

function tokenText(t) {
  if (isNumTok(t)) {
    const [a, b] = t.split('.');
    const g = a.replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    return b === undefined ? g : g + '.' + b;
  }
  return ({ '*': '×', '/': '÷', '-': '−' })[t] || t;
}

function voiceCommand(text) {
  const w = String(text).toLowerCase().replace(/[^a-z ]/g, '').trim();
  if (/^(clear|clear all|clear it|reset|start over|new calculation|all clear)$/.test(w)) return 'clear';
  if (/^(undo|scratch that|delete that|go back|never mind)$/.test(w)) return 'undo';
  if (/^(stop listening|pause|stop)$/.test(w)) return 'stop';
  return null;
}
// ---- core:end

// ---------------------------------------------------------------- state
const $ = (id) => document.getElementById(id);
const S = { tokens: [], sel: -1, typing: false, heard: '', interim: '', note: '', mic: 'idle', history: [], undo: null, keypad: false };

function loadPrefs() {
  try {
    const h = JSON.parse(localStorage.getItem('dc.history') || '[]');
    if (Array.isArray(h)) S.history = h.filter(x => x && Array.isArray(x.tokens) && typeof x.text === 'string' && typeof x.result === 'string').slice(0, 20);
    S.keypad = localStorage.getItem('dc.keypad') === '1';
  } catch (e) { /* storage unavailable */ }
}
function savePrefs() {
  try {
    localStorage.setItem('dc.history', JSON.stringify(S.history));
    localStorage.setItem('dc.keypad', S.keypad ? '1' : '0');
  } catch (e) { /* storage unavailable */ }
}

function pushHistory(tokens, value) {
  const item = { text: tokens.map(tokenText).join(' '), result: fmt(value), tokens: tokens.slice() };
  const top = S.history[0];
  if (top && top.text === item.text && top.result === item.result) return false;
  S.history.unshift(item);
  if (S.history.length > 20) S.history.length = 20;
  savePrefs();
  return true;
}

// ---------------------------------------------------------------- rendering
function renderHeard() {
  const el = $('heard');
  if (S.interim) { el.textContent = '“' + S.interim + '”'; el.className = 'heard interim'; }
  else if (S.heard) { el.textContent = '“' + S.heard + '”'; el.className = 'heard'; }
  else { el.textContent = ''; el.className = 'heard'; }
}

function renderChips() {
  const box = $('chips');
  box.textContent = '';
  const last = S.tokens.length - 1;
  S.tokens.forEach((t, i) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'chip' + (isNumTok(t) ? '' : ' op') + (S.typing && (S.sel === i || (S.sel === -1 && i === last)) ? ' typing' : '');
    b.textContent = tokenText(t);
    b.setAttribute('aria-pressed', S.sel === i ? 'true' : 'false');
    b.addEventListener('click', () => selectChip(i));
    box.appendChild(b);
  });
}

function renderResult() {
  const r = tryEval(S.tokens);
  const el = $('result');
  let text = '0', dim = true, note = S.note;
  if (r.ok) { text = fmt(r.value); dim = false; }
  else if (!r.empty) { text = '—'; if (r.message && !r.incomplete && !note) note = r.message; }
  el.textContent = text;
  el.className = 'result' + (dim ? ' dim' : '');
  const n = text.length;
  el.style.fontSize = n > 16 ? '1.6rem' : n > 12 ? '2.1rem' : n > 9 ? '2.7rem' : '';
  $('note').textContent = note;
}

const MIC_LABELS = {
  idle: 'Tap to start listening',
  starting: 'Starting microphone…',
  listening: 'Listening · tap to pause',
  blocked: 'Microphone blocked. Allow it in your browser’s site settings, then tap here.',
  nomic: 'No microphone found. Tap to retry.',
  network: 'Speech service unreachable. Tap to retry.',
  unsupported: 'Dictation isn’t supported in this browser. Try Chrome, Edge or Safari, or use the keypad.'
};
function renderMic() {
  const b = $('mic');
  b.dataset.state = S.mic;
  b.setAttribute('aria-pressed', S.mic === 'listening' || S.mic === 'starting' ? 'true' : 'false');
  b.disabled = S.mic === 'unsupported';
  $('micLabel').textContent = MIC_LABELS[S.mic] || '';
}

function renderKeypad() {
  $('keypad').hidden = !S.keypad;
  $('kpToggle').setAttribute('aria-pressed', S.keypad ? 'true' : 'false');
}

function renderHistory() {
  const list = $('history');
  list.textContent = '';
  S.history.slice(0, 6).forEach((h) => {
    const li = document.createElement('li');
    const b = document.createElement('button');
    b.type = 'button';
    const a = document.createElement('span'); a.className = 'expr'; a.textContent = h.text;
    const c = document.createElement('span'); c.className = 'res'; c.textContent = '= ' + h.result;
    b.append(a, c);
    b.addEventListener('click', () => loadHistory(h));
    li.appendChild(b);
    list.appendChild(li);
  });
  $('recent').hidden = S.history.length === 0;
}

function render() { renderHeard(); renderChips(); renderResult(); renderMic(); renderKeypad(); renderHistory(); }

// ---------------------------------------------------------------- editing (keypad)
function edit() { S.note = ''; S.interim = ''; }

function selectChip(i) {
  S.sel = S.sel === i ? -1 : i;
  S.typing = false;
  S.note = '';
  if (!S.keypad) { S.keypad = true; savePrefs(); }
  render();
}

function pressNumChar(ch) {
  edit();
  const t = S.tokens, i = S.sel;
  const start = ch === '.' ? '0.' : ch;
  const append = (idx) => {
    if (ch === '.' && t[idx].includes('.')) return;
    t[idx] = (t[idx] === '0' && ch !== '.') ? ch : t[idx] + ch;
  };
  if (i === -1) {
    const li = t.length - 1;
    if (li >= 0 && isNumTok(t[li])) {
      if (S.typing) append(li); else { t[li] = start; S.typing = true; }
    } else { t.push(start); S.typing = true; }
  } else if (isNumTok(t[i])) {
    if (S.typing) append(i); else { t[i] = start; S.typing = true; }
  } else {
    t.splice(i + 1, 0, start);
    S.sel = i + 1;
    S.typing = true;
  }
  render();
}

function pressOp(op) {
  edit();
  const t = S.tokens, i = S.sel;
  S.typing = false;
  if (i === -1) {
    if (t.length === 0) { if (op === '-') t.push('-'); }
    else {
      const last = t[t.length - 1];
      if (OPS.includes(last)) t[t.length - 1] = op;
      else if (last === '(') { if (op === '-') t.push('-'); }
      else t.push(op);
    }
  } else if (OPS.includes(t[i])) {
    t[i] = op;
  } else if (isNumTok(t[i]) || t[i] === ')' || t[i] === '%') {
    t.splice(i + 1, 0, op);
    S.sel = i + 1;
  } else if (t[i] === '(' && op === '-') {
    t.splice(i + 1, 0, op);
    S.sel = i + 1;
  }
  render();
}

function pressPercent() {
  edit();
  const t = S.tokens, i = S.sel;
  S.typing = false;
  if (i === -1) {
    const l = t[t.length - 1];
    if (isNumTok(l) || l === ')') t.push('%');
  } else if (isNumTok(t[i]) || t[i] === ')' || t[i] === '%') {
    t.splice(i + 1, 0, '%');
    S.sel = i + 1;
  }
  render();
}

function pressParen(p) {
  edit();
  const t = S.tokens, i = S.sel;
  S.typing = false;
  if (i !== -1) { t.splice(i + 1, 0, p); S.sel = i + 1; }
  else if (p === '(') t.push('(');
  else {
    const open = t.filter(x => x === '(').length - t.filter(x => x === ')').length;
    const l = t[t.length - 1];
    if (open > 0 && (isNumTok(l) || l === ')' || l === '%')) t.push(')');
  }
  render();
}

function pressBack() {
  edit();
  const t = S.tokens;
  const i = S.sel === -1 ? t.length - 1 : S.sel;
  if (i < 0) { render(); return; }
  if (isNumTok(t[i]) && t[i].length > 1) {
    t[i] = t[i].slice(0, -1);
    S.typing = true;
  } else {
    t.splice(i, 1);
    S.sel = -1;
    S.typing = false;
  }
  render();
}

function pressEquals() {
  edit();
  const r = tryEval(S.tokens);
  if (!r.ok) { render(); return; }
  pushHistory(S.tokens, r.value);
  S.tokens = [numToStr(parseFloat(r.value.toPrecision(12)))];
  S.sel = -1;
  S.typing = false;
  render();
}

function clearAll(pushIt) {
  const r = tryEval(S.tokens);
  const pushed = pushIt && r.ok ? pushHistory(S.tokens, r.value) : false;
  S.undo = { tokens: S.tokens.slice(), pushed };
  S.tokens = []; S.sel = -1; S.typing = false; S.heard = ''; S.interim = ''; S.note = '';
  render();
}

function loadHistory(h) {
  const r = tryEval(S.tokens);
  if (r.ok) pushHistory(S.tokens, r.value);
  S.tokens = h.tokens.slice();
  S.sel = -1; S.typing = false; S.note = ''; S.heard = ''; S.interim = '';
  render();
}

function handleKey(k) {
  if (/^\d$/.test(k) || k === '.') pressNumChar(k);
  else if (OPS.includes(k) && k !== '^') pressOp(k);
  else if (k === '^') pressOp('^');
  else if (k === '(' || k === ')') pressParen(k);
  else if (k === '%') pressPercent();
  else if (k === 'back') pressBack();
  else if (k === '=') pressEquals();
}

// ---------------------------------------------------------------- applying what was heard
function undoLast() {
  if (!S.undo) { S.note = 'Nothing to undo'; render(); return; }
  if (S.undo.pushed) S.history.shift();
  S.tokens = S.undo.tokens;
  S.undo = null;
  S.sel = -1; S.typing = false; S.note = ''; S.interim = '';
  savePrefs();
  render();
}

function onFinal(text) {
  S.interim = '';
  S.heard = text;
  S.note = '';
  const cmd = voiceCommand(text);
  if (cmd === 'clear') { clearAll(true); S.heard = text; render(); return; }
  if (cmd === 'undo') { undoLast(); return; }
  if (cmd === 'stop') { stopListening(); return; }

  const p = parseSpoken(text);
  if (!p.hasNumber) { S.note = 'No calculation heard'; render(); return; }

  const cur = tryEval(S.tokens);
  let pushed = false;
  if (cur.ok) pushed = pushHistory(S.tokens, cur.value);
  S.undo = { tokens: S.tokens.slice(), pushed };

  if (p.leadingOp && cur.ok) {
    S.tokens = [numToStr(parseFloat(cur.value.toPrecision(12)))].concat(p.tokens);
  } else {
    S.tokens = p.tokens;
  }
  S.sel = -1; S.typing = false;
  if (p.unknown.length) S.note = 'Skipped: ' + p.unknown.slice(0, 4).join(', ');
  render();
}

// ---------------------------------------------------------------- microphone
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const LOCAL_FILE = !!(window.location && window.location.protocol === 'file:');
let rec = null, wantListening = false, restartTimer = null, startedAt = 0, fastEnds = 0, gotSpeech = false;

function spin() {
  if (!wantListening || rec) return;
  rec = new SR();
  rec.lang = navigator.language || 'en-US';
  // Opened as a local file, browsers don't remember microphone permission, so every restart asks again.
  // Keep one long session open there. On a hosted page permission is remembered, so one phrase per session is fine.
  rec.continuous = LOCAL_FILE;
  rec.interimResults = true;
  rec.maxAlternatives = 1;
  gotSpeech = false;
  rec.onstart = () => { startedAt = Date.now(); S.mic = 'listening'; renderMic(); };
  rec.onresult = (e) => {
    let interim = '';
    const finals = [];
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const r = e.results[i];
      if (r.isFinal) finals.push(r[0].transcript.trim()); else interim += r[0].transcript;
    }
    gotSpeech = true;
    finals.filter(Boolean).forEach(onFinal);
    if (!finals.length && interim) { S.interim = interim.trim(); renderHeard(); }
  };
  rec.onerror = (e) => {
    if (e.error === 'not-allowed' || e.error === 'service-not-allowed') { wantListening = false; S.mic = 'blocked'; }
    else if (e.error === 'audio-capture') { wantListening = false; S.mic = 'nomic'; }
    else if (e.error === 'network') { wantListening = false; S.mic = 'network'; }
  };
  rec.onend = () => {
    rec = null;
    S.interim = '';
    const dur = Date.now() - startedAt;
    fastEnds = (dur < 700 && !gotSpeech) ? fastEnds + 1 : 0;
    if (wantListening) {
      if (fastEnds >= 6) { wantListening = false; S.mic = 'idle'; S.note = 'The microphone keeps stopping. Tap to try again.'; fastEnds = 0; }
      else { S.mic = 'starting'; restartTimer = setTimeout(spin, fastEnds ? 600 : 150); }
    } else if (S.mic === 'listening' || S.mic === 'starting') {
      S.mic = 'idle';
    }
    render();
  };
  try { rec.start(); } catch (err) { rec = null; restartTimer = setTimeout(spin, 400); }
}

function startListening() {
  if (!SR) return;
  wantListening = true;
  fastEnds = 0;
  S.mic = 'starting';
  S.note = '';
  renderMic();
  spin();
}

function stopListening() {
  wantListening = false;
  clearTimeout(restartTimer);
  if (rec) { try { rec.abort(); } catch (e) { /* already stopped */ } }
  S.mic = 'idle';
  S.interim = '';
  render();
}

// ---------------------------------------------------------------- wiring
function init() {
  loadPrefs();
  if (!SR) { S.mic = 'unsupported'; S.keypad = true; }
  $('mic').addEventListener('click', () => { if (wantListening) stopListening(); else startListening(); });
  $('kpToggle').addEventListener('click', () => { S.keypad = !S.keypad; if (!S.keypad) { S.sel = -1; S.typing = false; } savePrefs(); render(); });
  $('clear').addEventListener('click', () => clearAll(true));
  $('keypad').addEventListener('click', (e) => {
    const b = e.target.closest('button[data-k]');
    if (b) handleKey(b.dataset.k);
  });
  $('chips').addEventListener('click', (e) => {
    if (e.target === $('chips')) { S.sel = -1; S.typing = false; render(); }
  });
  document.addEventListener('keydown', (e) => {
    if (!S.keypad || e.ctrlKey || e.metaKey || e.altKey) return;
    const k = e.key;
    if ((k === 'Enter' || k === ' ') && e.target && e.target.tagName === 'BUTTON') return;
    let handled = true;
    if (/^\d$/.test(k) || k === '.') pressNumChar(k);
    else if (k === '+' || k === '-' || k === '/' || k === '^') pressOp(k);
    else if (k === '*' || k === 'x' || k === 'X') pressOp('*');
    else if (k === '(' || k === ')') pressParen(k);
    else if (k === '%') pressPercent();
    else if (k === 'Backspace') pressBack();
    else if (k === 'Enter' || k === '=') pressEquals();
    else if (k === 'Escape') clearAll(true);
    else handled = false;
    if (handled) e.preventDefault();
  });
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && wantListening && !rec) { clearTimeout(restartTimer); spin(); }
  });
  render();

  // If the browser already has microphone permission for this page, start listening right away.
  if (SR && navigator.permissions && navigator.permissions.query) {
    navigator.permissions.query({ name: 'microphone' }).then((p) => { if (p.state === 'granted') startListening(); }).catch(() => {});
  }
}
init();
</script>
</body>
</html>
